name: Python PR Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  python-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check Python Version
        run: python --version
